# Chat profiles: how a model family expects a conversation to be driven.
#
# Thinking mode is requested through a chat-template variable, which
# openvino_genai passes with ChatHistory.set_extra_context(); the source
# repository's template is never modified.
#
# A profile does not have to know the variable. When it leaves
# supports_thinking_flag unset, the runtime tries `thinking_variable_candidates`
# against the artifact's OWN chat template and applies the first one the
# template actually references. That is evidence rather than a guess, and it is
# what makes a family nobody has written a rule for behave correctly. Setting
# supports_thinking_flag explicitly overrides that decision in either direction:
# `true` applies `thinking_template_variable` unconditionally, `false` vetoes
# every variable.
#
# `tool_calling` (schema 3) says how a family writes tool calls, and only a
# family seen doing it on the reference host gets one: `yonga serve` refuses
# `tools` for every other model. The format is one of the parsers compiled
# into yonga; `template_contains` keeps the entry off an artifact whose own
# chat template does not ask for that format. Measured and left undeclared on
# 2026-10-09 because their output was not a parseable call: Llama-3.2-1B
# (echoed the schema), LFM2-350M (degenerate output), gemma-3-1b and OLMo-2-1B
# (GenAI's generic tool prompt, answered with fenced JSON and wrong or
# invented arguments). Qwen3.5 was not measured.
schema_version: 3

chat:
  - id: chat-qwen3_5
    schema_version: 1
    status: active
    priority: 100
    summary: Qwen3.5 chat defaults, thinking disabled unless asked for
    match:
      model_types:
        - qwen3_5
      architectures:
        - Qwen3_5ForConditionalGeneration
        - Qwen3_5ForCausalLM
    supports_thinking_flag: true
    thinking_template_variable: enable_thinking
    default_thinking: false
    reasoning_wrappers:
      - ["<think>", "</think>"]
    defaults:
      temperature: 0.7
      top_p: 0.8
      top_k: 20
      max_new_tokens: 4096
    thinking_defaults:
      temperature: 0.6
      top_p: 0.95
      top_k: 20
    sources:
      - kind: model_card
        url: https://huggingface.co/nDimensional/Qwen3.5-9B-Uncensored-Safetensors
      - kind: community
        note: >-
          Qwen chat templates expose enable_thinking, and the family documents
          different sampling defaults for thinking and non-thinking modes.

  - id: chat-qwen3
    schema_version: 3
    status: active
    priority: 100
    summary: Qwen3 sampling defaults; the thinking variable comes from the template
    match:
      model_types:
        - qwen3
      architectures:
        - Qwen3ForCausalLM
    # supports_thinking_flag is deliberately unset: Qwen3 chat templates guard
    # the reasoning prelude with `enable_thinking is defined and enable_thinking
    # is false`, so the template itself is the evidence. A repackaged Qwen3 whose
    # template dropped that guard must not be sent a variable it ignores.
    default_thinking: false
    reasoning_wrappers:
      - ["<think>", "</think>"]
    defaults:
      temperature: 0.7
      top_p: 0.8
      top_k: 20
      max_new_tokens: 4096
    thinking_defaults:
      temperature: 0.6
      top_p: 0.95
      top_k: 20
    tool_calling:
      format: tagged_json
      open: "<tool_call>"
      close: "</tool_call>"
      template_contains: "<tool_call>"
      evidence: tested
      sources:
        - kind: tested
          note: >-
            2026-10-09, reference host, OpenVINO GenAI 2026.4, CPU, Qwen3-0.6B
            and Qwen3-1.7B: offered one get_weather tool and asked for the
            weather in Ankara (max_new_tokens 120), each answered
            <tool_call>{"name": "get_weather", "arguments": {"city": "Ankara"}}</tool_call>.
            One prompt per model, one turn; a second turn carrying the tool
            result, GPU and NPU were not run. The Qwen3 MoE models were not
            run either, so chat-qwen3_moe declares no tool calling.
    sources:
      - kind: model_card
        url: https://huggingface.co/Qwen/Qwen3-0.6B
        note: >-
          The Qwen3 model card documents temperature 0.7, top_p 0.8, top_k 20 for
          non-thinking mode and temperature 0.6, top_p 0.95, top_k 20 for
          thinking mode.
      - kind: community
        note: >-
          Qwen3 chat_template.jinja emits an empty <think> block when
          enable_thinking is false, which is why the wrapper is stripped as well
          as suppressed.

  # Qwen3 MoE keeps chat-qwen3's policy exactly, without its tool_calling: the
  # MoE models share the template but were not measured writing calls.
  - id: chat-qwen3_moe
    schema_version: 1
    status: active
    priority: 100
    summary: Qwen3 MoE with chat-qwen3's policy; tool calls not measured
    match:
      model_types:
        - qwen3_moe
      architectures:
        - Qwen3MoeForCausalLM
    default_thinking: false
    reasoning_wrappers:
      - ["<think>", "</think>"]
    defaults:
      temperature: 0.7
      top_p: 0.8
      top_k: 20
      max_new_tokens: 4096
    thinking_defaults:
      temperature: 0.6
      top_p: 0.95
      top_k: 20
    sources:
      - kind: community
        note: >-
          chat-qwen3 matched the Qwen3 MoE models until it declared tool
          calling; this rule keeps the policy they had then, unchanged.

  # The three rules below keep chat-default's conservative policy exactly (the
  # family documents nothing yonga applies yet) and add the measured tool-call
  # format; a model of these families behaved the same before they existed.
  - id: chat-qwen2
    schema_version: 3
    status: active
    priority: 100
    summary: Qwen2 family with chat-default's policy, plus tool calls measured on Qwen2.5
    match:
      model_types:
        - qwen2
      architectures:
        - Qwen2ForCausalLM
    default_thinking: false
    reasoning_wrappers:
      - ["<think>", "</think>"]
    defaults:
      max_new_tokens: 4096
    tool_calling:
      format: tagged_json
      open: "<tool_call>"
      close: "</tool_call>"
      # Only Qwen2.5 Instruct was measured, and only templates that ask for
      # this format accept tools: the original Qwen2 Instruct templates are
      # plain ChatML, and distilled models built on qwen2 (such as
      # DeepSeek-R1-Distill-Qwen) ship another template.
      template_contains: "<tool_call>"
      evidence: tested
      sources:
        - kind: tested
          note: >-
            2026-10-09, reference host, OpenVINO GenAI 2026.4, CPU,
            Qwen2.5-0.5B-Instruct: offered one get_weather tool and asked for
            the weather in Ankara (max_new_tokens 120), it answered
            <tool_call>{"name": "get_weather", "arguments": {"city": "Ankara"}}</tool_call>.
            One prompt, one turn; GPU, NPU and a second turn were not run.

  - id: chat-smollm3
    schema_version: 3
    status: active
    priority: 100
    summary: SmolLM3 with chat-default's policy, plus measured tool calls
    match:
      model_types:
        - smollm3
      architectures:
        - SmolLM3ForCausalLM
    default_thinking: false
    reasoning_wrappers:
      - ["<think>", "</think>"]
    defaults:
      max_new_tokens: 4096
    tool_calling:
      format: tagged_json
      open: "<tool_call>"
      close: "</tool_call>"
      template_contains: "<tool_call>"
      evidence: tested
      sources:
        - kind: tested
          note: >-
            2026-10-09, reference host, OpenVINO GenAI 2026.4, CPU, SmolLM3-3B:
            offered one get_weather tool and asked for the weather in Ankara
            (max_new_tokens 120), it answered
            <tool_call>{"name": "get_weather", "arguments": {"city": "Ankara"}}</tool_call>.
            One prompt, one turn; GPU, NPU and a second turn were not run.

  - id: chat-granite
    schema_version: 3
    status: active
    priority: 100
    summary: Granite with chat-default's policy, plus measured tool calls
    match:
      model_types:
        - granite
      architectures:
        - GraniteForCausalLM
    default_thinking: false
    reasoning_wrappers:
      - ["<think>", "</think>"]
    defaults:
      max_new_tokens: 4096
    tool_calling:
      # <|tool_call|> is a special token, so the detokenizer removes it and the
      # answer is the bare JSON list; it is still accepted when present.
      format: json_list
      open: "<|tool_call|>"
      template_contains: "<|tool_call|>"
      evidence: tested
      sources:
        - kind: tested
          note: >-
            2026-10-09, reference host, OpenVINO GenAI 2026.4, CPU,
            granite-3.3-2b-instruct: offered one get_weather tool and asked for
            the weather in Ankara (max_new_tokens 120), it answered
            [{"name": "get_weather", "arguments": {"city": "Ankara"}}].
            One prompt, one turn; GPU, NPU and a second turn were not run.

  - id: chat-default
    schema_version: 1
    status: active
    priority: 10
    summary: Conservative chat defaults for models with no family-specific profile
    # No stance on thinking: the runtime decides from the artifact's own chat
    # template. A registry that has never heard of a family still suppresses its
    # reasoning, which is the whole point of detecting rather than enumerating.
    default_thinking: false
    reasoning_wrappers:
      - ["<think>", "</think>"]
    defaults:
      max_new_tokens: 4096
    sources:
      - kind: community
        note: >-
          The <think> wrapper is stripped defensively even when the family is
          unknown, so hidden reasoning never reaches the screen by accident.
