# Known failure signatures.
#
# Prefer exact strings over regexes. A rule that names a model family beats a
# rule that only names a device, so a family-specific diagnosis wins where it
# applies and the generic one still covers everything else.
#
# Schema 4 only for `blocks_export` (optimum-normalized-config-allow-new); every
# other rule here still declares the version it needs.
schema_version: 4

issues:
  - id: qwen35-npu-fp16-bufferize
    schema_version: 1
    status: active
    priority: 100
    summary: The current NPU compiler rejects part of the Qwen3.5 graph
    match:
      model_types:
        - qwen3_5
      device: npu
      case_sensitive: true
      exception_contains:
        - "OneShotBufferizeVPU2VPUIP failed : Only supports FP16"
    classification:
      code: npu.compiler.unsupported_graph.qwen35
      category: compiler_unsupported_graph
      environment_broken: false
      retry_same_device: false
    recommendation:
      title: Qwen3.5 cannot be compiled for the NPU
      message: >-
        The NPU compiler ran and refused this Qwen3.5 graph: one of its
        operations is only implemented for FP16 on the NPU. The driver and the
        compiler are working; the graph is what this NPU release cannot take.
      fallback_devices:
        - gpu
        - cpu
      remediation:
        - "Prepare this model for the GPU: yonga prepare MODEL --device gpu"
        - Keep the NPU for architectures the registry marks as supported.
    sources:
      - kind: tested
        note: >-
          Reproduced on a Lunar Lake host with OpenVINO 2026.4 and
          compiler-in-plugin while preparing a Qwen3.5-9B derivative.

  - id: npu-compiler-dynamic-shape
    schema_version: 1
    status: active
    priority: 70
    summary: The NPU compiler cannot compile a dynamically shaped graph
    match:
      device: npu
      case_sensitive: true
      exception_contains:
        - "to_shape was called on a dynamic shape"
    classification:
      code: npu.compiler.dynamic_shape
      category: compiler_unsupported_graph
      environment_broken: false
      retry_same_device: false
      # A raw Core.compile_model of a stateful LLM keeps its dynamic shapes, so
      # on the NPU it fails for EVERY such model -- it is not evidence about
      # this one. The GenAI NPU pipeline reshapes to MAX_PROMPT_LEN /
      # MIN_RESPONSE_LEN before compiling, which is how the model actually
      # runs. Verified on the reference host: Qwen3-0.6B (INT4 sym, g128) fails
      # the raw compile with this exact message, then loads and generates
      # through LLMPipeline on the same NPU. So the pipeline decides.
      defer_to_pipeline: true
    recommendation:
      title: The NPU needs a statically shaped graph
      message: >-
        The NPU compiler requires every tensor shape to be known at compile
        time, and this IR still has dynamic dimensions. OpenVINO GenAI reshapes
        a model for the NPU through the MAX_PROMPT_LEN and MIN_RESPONSE_LEN
        pipeline properties; a raw IR compiled directly keeps its dynamic
        shapes and is rejected. The NPU itself is healthy: the driver answered
        and the compiler returned a message.
      fallback_devices:
        - gpu
        - cpu
      remediation:
        - >-
          yonga already probes the NPU through the GenAI pipeline, which
          reshapes to MAX_PROMPT_LEN / MIN_RESPONSE_LEN. If you are seeing this,
          that pipeline could not be built either -- read the smoke-test error
          in the job log for the real reason.
        - "Or run this model on the GPU: yonga prepare MODEL --device gpu"
    sources:
      - kind: tested
        note: >-
          Reproduced on this reference host by compiling a text-generation IR
          for the NPU with OpenVINO 2026.4; the compiler returned
          "Exception from src/core/src/partial_shape.cpp:261: to_shape was
          called on a dynamic shape."

  - id: npu-compiler-unsupported-graph-generic
    schema_version: 1
    status: active
    priority: 50
    summary: The NPU compiler rejected this graph
    match:
      device: npu
      case_sensitive: true
      exception_contains:
        - "OneShotBufferizeVPU2VPUIP failed"
    classification:
      code: npu.compiler.unsupported_graph
      category: compiler_unsupported_graph
      environment_broken: false
      retry_same_device: false
    recommendation:
      title: This graph cannot be compiled for the NPU
      message: >-
        The NPU compiler ran and refused the graph. This is a model/compiler
        limitation, not a broken driver or a missing package.
      fallback_devices:
        - gpu
        - cpu
      remediation:
        - "Prepare this model for the GPU or the CPU instead."
        - Re-check after an OpenVINO and NPU compiler update.
    sources:
      - kind: tested
        note: >-
          Generic form of the Qwen3.5 bufferization failure, kept less specific
          so a family-scoped rule always wins where one exists.

  - id: npu-static-reshape-broadcast
    schema_version: 1
    status: active
    priority: 60
    summary: The NPU pipeline could not reshape this graph to static shapes
    match:
      device: npu
      case_sensitive: true
      exception_contains:
        - "Broadcast incorrect target shape"
    classification:
      code: npu.pipeline.static_reshape_failed
      category: compiler_unsupported_graph
      environment_broken: false
      retry_same_device: false
    recommendation:
      title: The NPU cannot run this graph at static shapes
      message: >-
        The OpenVINO GenAI NPU pipeline reshapes a model to MAX_PROMPT_LEN and
        MIN_RESPONSE_LEN before compiling it, and shape inference rejected one
        of this graph's Broadcast operations while doing so. The NPU, its
        driver and its compiler are fine. Observed for a model OpenVINO GenAI
        built from a GGUF file.
      fallback_devices:
        - gpu
        - cpu
      remediation:
        - "Prepare it for the GPU or the CPU: yonga prepare MODEL --device gpu"
        - >-
          An optimum-intel export of the same model from its safetensors
          repository builds a different graph; prepare that with an NPU
          profile and let the probe decide.
    sources:
      - kind: tested
        note: >-
          Qwen/Qwen2.5-0.5B-Instruct-GGUF Q4_0 imported by OpenVINO GenAI
          2026.4 and loaded on a Lunar Lake NPU: "Broadcast incorrect target
          shape. Expecting either 1 or 1024. Got 0".

  # Lower priority than every rule above it, so a named compiler pass failure is
  # only ever the answer when nothing more specific recognised the text. It exists
  # because the "generic" rule above is not generic: it matches one bufferization
  # message, and every other compiler pass that refuses a graph fell through to
  # the built-in signatures, which suggested checking the driver. The driver is
  # exactly what is *not* wrong here, and TROUBLESHOOTING section 5.1 tells users
  # so; the classifier should not tell them the opposite.
  - id: npu-compiler-pass-failed
    schema_version: 1
    status: active
    priority: 40
    summary: A named NPU compiler pass refused this graph
    match:
      device: npu
      case_sensitive: true
      exception_contains:
        # The compiler answered. A missing or broken driver does not get this far:
        # it reports ZE_RESULT_ERROR_UNINITIALIZED, or the NPU is absent from
        # available_devices, and `device.driver_missing` covers those.
        - "[NPU_VCL] Compiler returned msg:"
        - "[vpux-compiler] Failed Pass"
    classification:
      code: npu.compiler.pass_failed
      category: compiler_unsupported_graph
      environment_broken: false
      retry_same_device: false
    recommendation:
      title: The NPU compiler refused this graph
      message: >-
        One of the NPU compiler's passes could not compile this graph. The
        driver answered and the compiler ran and returned a message, so nothing
        is wrong with the NPU, its driver or the installation: this graph is
        what this compiler release cannot take. Reinstalling the driver will not
        change it.
      fallback_devices:
        - gpu
        - cpu
      remediation:
        - "Run this model on the GPU instead: yonga prepare MODEL --device gpu"
        - >-
          The failing pass and the shape it rejected are in the job log:
          yonga logs JOB_ID --raw
        - Re-check after an OpenVINO and NPU compiler update.
    sources:
      - kind: tested
        note: >-
          Reproduced on this reference host with OpenVINO 2026.4 and
          compiler-in-plugin by loading a Qwen3-0.6B artifact on the NPU:
          "[vpux-compiler] MultiClusterStrategyAssignment Pass failed : Cannot
          get per cluster memory shapes. Shape [1, 1, 8, 1], Unsupported
          distribution", then "Compilation failed. Level0 pfnCreate2 result:
          ZE_RESULT_ERROR_INVALID_ARGUMENT ... [NPU_VCL] Compiler returned msg:".
          Before this rule the failure fell through to a generic message whose
          remediation was "Run `yonga doctor` to check the device and driver
          state".

  # Below npu-compiler-pass-failed on purpose: a compiler that loaded and
  # refused the graph says so with "[NPU_VCL] Compiler returned msg:", and that
  # diagnosis is the more precise one when both match. Without it, the text
  # alone cannot tell a missing compiler from one that cannot take this IR's
  # opset (or a blob from a newer plugin), so the rule names both and keeps the
  # fallback; `yonga doctor` tells them apart by NPU_COMPILER_VERSION.
  - id: npu-unsupported-feature
    schema_version: 1
    status: active
    priority: 35
    summary: The NPU driver refused the graph as an unsupported feature
    match:
      device: npu
      case_sensitive: true
      exception_contains:
        - "pfnCreate2 result: ZE_RESULT_ERROR_UNSUPPORTED_FEATURE"
    classification:
      code: npu.compiler.unsupported_feature
      category: compiler_unsupported_graph
      environment_broken: false
      retry_same_device: false
    recommendation:
      title: The NPU driver could not compile this graph
      message: >-
        The NPU driver refused to create the graph as an unsupported feature,
        and no compiler message came with it. Either the driver has no
        compiler library to compile with (yonga doctor then reads 'missing' on
        the NPU compiler line, and no model compiles for the NPU), or the
        compiler it has cannot take this model's IR or opset version.
      fallback_devices:
        - gpu
        - cpu
      remediation:
        - "Check the compiler: yonga doctor (the NPU section's compiler line)"
        - >-
          If it reads 'missing', install the NPU compiler matching your NPU
          driver version: doctor names the package for your distribution (on
          Arch, whose intel-npu-driver leaves it out, copy
          libopenvino_intel_npu_compiler.so and
          libopenvino_intel_npu_compiler_loader.so from the same release's
          intel-driver-compiler-npu .deb at
          https://github.com/intel/linux-npu-driver/releases into /usr/lib).
        - "Otherwise use another device: yonga prepare MODEL --device gpu"
    sources:
      - kind: tested
        note: >-
          Reproduced on CachyOS with Arch's intel-npu-driver 1.38.0 (no compiler
          in the package; NPU_COMPILER_TYPE CompilerType.DRIVER,
          NPU_COMPILER_VERSION 0), OpenVINO 2026.4.1 and an Arrow Lake Core
          Ultra 7 255U, preparing Qwen3-4B for the NPU: "Compilation failed.
          Level0 pfnCreate2 result: ZE_RESULT_ERROR_UNSUPPORTED_FEATURE, code
          0x78000003". The driver log showed it failing to dlopen
          /usr/lib/libopenvino_intel_npu_compiler_loader.so; with the compiler
          installed the same artifact compiled and generated on the NPU.

  - id: tokenizer-string-precision-read
    schema_version: 1
    status: active
    priority: 100
    summary: The tokenizer IR declares a mixed-case string precision OpenVINO cannot read
    match:
      case_sensitive: true
      exception_contains:
        - "Unsupported element type: STRiNG"
    classification:
      code: tokenizer.ir.string_precision
      category: tokenizer_ir_incompatible
      environment_broken: false
      retry_same_device: false
    recommendation:
      title: The exported tokenizer IR cannot be read back
      message: >-
        The exported tokenizer XML writes the port precision as "STRiNG" while
        the same layer's element type is the correct lower-case "string".
        OpenVINO rejects the mixed-case spelling, so the tokenizer and the
        detokenizer cannot be loaded. This is an export defect in the artifact,
        not a problem with the model or the device.
      repair: ov-tokenizer-precision-string-casing
      remediation:
        - >-
          Re-prepare the artifact: yonga applies this repair itself during
          validation, so `yonga prepare MODEL --force` produces a readable
          tokenizer. (`--no-repair` is what turns that off.)
        - Only the port precision attribute is rewritten; element_type is left alone.
    sources:
      - kind: tested
        note: >-
          Reproduced on this reference host with openvino 2026.4.0 and
          openvino-tokenizers 2026.4.0.0; every fresh export contains the defect.

  - id: npu-permission-denied
    schema_version: 1
    status: active
    priority: 90
    summary: The NPU device node cannot be opened by this user
    match:
      device: npu
      exception_contains:
        - "Permission denied"
        - "EACCES"
        - "Operation not permitted"
    classification:
      code: npu.device.permission_denied
      category: permission_denied
      environment_broken: true
      retry_same_device: false
    recommendation:
      title: No permission to use the NPU device node
      message: >-
        The kernel refused access to the NPU accelerator node. This is a host
        permission problem, so yonga will not quietly move the job to another
        device: fixing the permission is what you actually want, and a silent
        fallback would hide a broken environment.
      remediation:
        - "Check the device node: ls -l /dev/accel/accel0"
        - "Add your user to the owning group (usually render), then log out and back in."
        - "Run: yonga doctor"
      fallback_devices: []
    sources:
      - kind: community
        note: >-
          Generic POSIX permission wording; the exact plugin message was not
          reproduced on the reference host, where the user is already in the
          render group.

  - id: runtime-out-of-memory
    schema_version: 1
    status: active
    priority: 60
    summary: The host or the accelerator ran out of memory
    match:
      exception_contains:
        - "std::bad_alloc"
        - "Out of memory"
        - "Cannot allocate memory"
        - "CL_OUT_OF_RESOURCES"
        - "ZE_RESULT_ERROR_OUT_OF_DEVICE_MEMORY"
        - "ZE_RESULT_ERROR_OUT_OF_HOST_MEMORY"
    classification:
      code: runtime.out_of_memory
      category: out_of_memory
      environment_broken: false
      retry_same_device: false
    recommendation:
      title: Out of memory
      message: >-
        The step ran out of memory. Conversion and the first compile are the
        most memory-hungry parts of a preparation.
      remediation:
        - Close other applications and retry.
        - Choose a profile with stronger weight compression, or a smaller group size.
        - "Check the reported memory: yonga doctor"
    sources:
      - kind: community
        note: Standard allocator and Level Zero out-of-memory wordings.

  - id: storage-no-space-left
    schema_version: 1
    status: active
    priority: 65
    summary: A write failed because the filesystem is full
    match:
      exception_contains:
        - "No space left on device"
        - "basic_ios::clear: iostream error"
        - "Disk quota exceeded"
    classification:
      code: storage.insufficient_disk
      category: insufficient_disk
      environment_broken: false
      retry_same_device: false
    recommendation:
      title: Not enough free disk space
      message: >-
        A file could not be written because the filesystem ran out of space.
        OpenVINO reports this as an iostream error when it fails to save an IR,
        which looks like a serialisation bug but is a full disk.
      remediation:
        - Free space on the cache and data filesystems, then retry.
        - >-
          Point YONGA_CACHE_DIR at a disk-backed directory with room for several
          times the model size; a tmpfs /tmp is usually far too small.
        - "Run: yonga doctor"
    sources:
      - kind: community
        note: >-
          The iostream wording is what OpenVINO surfaces when serialisation
          cannot write the .bin file.

  # Category choice: `permission_denied` (exit 10), because the one cause
  # actually observed is a file the reader may not open read-write. OpenVINO
  # GenAI's GGUF reader opens the file with O_RDWR|O_APPEND although it never
  # writes to it, and huggingface-hub 1.x stores its blobs read-only (0444), so
  # handing the reader a link into the cache failed for every fresh cache. yonga
  # now imports from a private, writable copy in staging, so this rule should
  # only fire for a staging directory that refuses the write (a read-only
  # mount, an ACL) or a file that is not a GGUF at all; the message names both.
  # Without it the failure was `unknown_runtime_error`.
  - id: gguf-reader-open-failed
    schema_version: 1
    status: active
    priority: 85
    summary: OpenVINO GenAI's GGUF reader could not open the file
    match:
      case_sensitive: true
      exception_contains:
        - "with gguf_open"
    classification:
      code: export.gguf.open_failed
      category: permission_denied
      environment_broken: false
      retry_same_device: false
    recommendation:
      title: OpenVINO GenAI could not open the GGUF file
      message: >-
        The GGUF reader in OpenVINO GenAI opens the file for reading and
        writing, so a file this user may only read is refused, and so is one
        that does not start with a GGUF header. yonga imports from its own
        writable copy in the job's staging directory, so the usual causes are a
        data directory this user cannot write to, or a damaged download. No
        device is involved: nothing had been compiled.
      fallback_devices: []
      remediation:
        - "Check that the data directory is writable: yonga doctor"
        - >-
          If the download may be damaged, check it against the Hub with
          hf cache verify REPO, and remove a bad copy with hf cache rm model/REPO.
        - "The reader's own message is in the job log: yonga logs JOB_ID --raw"
    sources:
      - kind: tested
        note: |-
          Reproduced on this reference host with OpenVINO GenAI 2026.4.1 and
          Qwen/Qwen2.5-0.5B-Instruct-GGUF Q4_0 and Q8_0 from a huggingface-hub
          1.x cache, whose blobs are mode 0444:
            RuntimeError: Check 'ctx' failed at .../gguf_utils/gguf.cpp:317:
            Failed to open '.../model/qwen2.5-0.5b-instruct-q4_0.gguf' with
            gguf_open
          strace showed openat(..., O_RDWR|O_APPEND) = -1 EACCES. A writable
          copy of the same bytes imports in 6 s and is left unmodified.

  # Category choice, deliberately: `configuration_error`, not
  # `source_format_unsupported`. The source is a perfectly convertible
  # safetensors checkpoint and converts on the very next attempt once the
  # profile changes, so nothing about its *format* is unsupported; what is
  # wrong is the conversion setting yonga asked for (group size 128) against
  # this model's channel sizes. `configuration_error` carries exit code 70
  # ("registry/configuration error", CLI_SPEC section 15), which points at the
  # profile that has to change rather than at the model that has to be
  # replaced. Without this rule the failure surfaces as the generic
  # `export.failed` / exit 40.
  - id: nncf-group-size-not-divisible
    schema_version: 1
    status: active
    priority: 80
    summary: The profile's group size does not divide this model's channel sizes
    match:
      case_sensitive: true
      exception_contains:
        - "InvalidGroupSizeError"
        - "Failed to apply group-wise quantization with group size value"
    classification:
      code: export.quantization.group_size_mismatch
      category: configuration_error
      environment_broken: false
      retry_same_device: false
    recommendation:
      title: This model cannot be quantized with the profile's group size
      message: >-
        Group-wise INT4 quantization splits every weight row into groups of a
        fixed size, so the group size has to divide each layer's channel size.
        NNCF listed the layers where it does not: their channel size is smaller
        than, or not a multiple of, the group size this profile asks for. The
        installation, the devices and the source model are all fine; the
        conversion setting is what does not fit this model. Nothing had been
        compiled when this failed, so no device is implicated.
      # MODEL and JOB_ID are filled in with the repository and the job when
      # they are known; see "Placeholders in remediation" in docs/REGISTRY_SPEC.md.
      remediation:
        - >-
          Re-run with a profile that has no group size. On the CPU that is the
          8-bit reference: yonga prepare MODEL --device cpu --profile
          cpu-int8-asym-ref. On the NPU it is the channel-wise profile (group
          size -1, one scale per output channel): yonga prepare MODEL --device
          npu --profile npu-int4-sym-cw. Each is for its own device:
          npu-int4-sym-cw carries the NPU pipeline's MAX_PROMPT_LEN, which the
          CPU and GPU plugins reject when the artifact is probed.
        - >-
          When only a few small layers fail (Qwen3.5 0.8B-4B fail on one
          one-channel rotary_emb weight), the ratio-0.8 profile for the device
          may do, because it keeps a fifth of the weights at INT8: yonga prepare
          MODEL --device cpu --profile cpu-int4-asym-g128-r08 (or --device gpu
          --profile gpu-int4-asym-g128-r08).
          It prepared those models; that it skips the failing layer is observed,
          not guaranteed. When most layers fail, as they do when the hidden size
          is not a multiple of 128, it cannot help.
        - >-
          Or pick a profile whose group size divides every channel size in the
          error; the shipped group-wise profiles all use 128.
        - >-
          The failing nodes and their channel sizes are in the job log:
          yonga logs JOB_ID --raw
    sources:
      - kind: tested
        note: |-
          Reproduced on this reference host with optimum-intel 2.2.0 and nncf
          3.4.0. `yonga prepare hf-internal-testing/tiny-random-LlamaForCausalLM
          --device cpu` (profile cpu-int4-asym-g128) exited 40 with the generic
          exporter message, while the job log ended with:
            nncf.errors.InvalidGroupSizeError: Failed to apply group-wise
            quantization with group size value 128. Ensure that the group size
            is divisible by the channel size ... Failed nodes:
            "__module.model.layers.0.self_attn.v_proj/aten::linear/MatMul"
            (channel size: 16)
          Re-running the same model with --profile npu-int4-sym-cw (group size
          -1) converts and publishes successfully.
      - kind: tested
        note: >-
          HuggingFaceTB/SmolLM2-360M-Instruct (hidden size 960) with
          cpu-int4-asym-g128-r08 on the reference host, optimum-intel 2.2.0 and
          nncf 3.4.0: the ratio did not help, NNCF refused 118 nodes of channel
          size 960. The list pushed the exception line out of the 40-line output
          tail, so the failure surfaced as the generic export.failed until the
          exporter kept exception lines in front of the tail.
      - kind: tested
        note: >-
          Qwen/Qwen3-0.6B prepared with --profile npu-int4-sym-cw on the
          reference host (2026-10-11) converts, then fails the probe on the CPU
          ("Unsupported property MAX_PROMPT_LEN by CPU plugin") and on the GPU
          ("Option not found: MAX_PROMPT_LEN"), so the remediation no longer
          offers the NPU profile for those devices.

  # Category choice, deliberately: `package_abi_mismatch`. SPEC section 5.3 states
  # the ABI rule as being about a compatible package *set*, and that is exactly
  # what is wrong here: each package imports and works on its own, but
  # optimum-intel's export patcher reaches into `transformers` internals, and the
  # installed pair does not agree on what those internals are. The alternatives
  # are worse. `configuration_error` carries exit 70 ("registry/configuration
  # error"), which points at yonga's own settings; nothing yonga was asked to do
  # is wrong. `unknown_runtime_error` carries exit 99 and says nothing.
  # `package_abi_mismatch` carries exit 10 ("environment unusable"), and the
  # environment is where the fix is: one `pip install` away.
  #
  # `environment_broken: false` all the same, and the two are not in conflict:
  # the flag drives device fallback in `prepare` (a broken environment stops the
  # job instead of trying another device), and this installation is not broken.
  # Every package imports, every device works, and the very same environment
  # exports other architectures. What is wrong is the *combination* of two
  # versions for this one architecture, so there is nothing to fall back to and
  # nothing to declare dead. `retry_same_device: false` for the same reason: the
  # device was never reached, and retrying changes nothing until a package does.
  - id: qwen35-exporter-transformers-symbol-mismatch
    schema_version: 1
    status: active
    priority: 100
    summary: The installed Transformers does not expose the Qwen3.5 symbol the exporter patches
    match:
      model_types:
        - qwen3_5
      case_sensitive: true
      exception_contains:
        - "Qwen3_5DynamicCache"
    classification:
      code: export.transformers.symbol_missing.qwen35
      category: package_abi_mismatch
      environment_broken: false
      retry_same_device: false
    recommendation:
      title: This Transformers release cannot export Qwen3.5
      message: >-
        The exporter's Qwen3.5 patcher imports `Qwen3_5DynamicCache` from the
        installed `transformers`, and this release does not define it. Nothing
        is broken: `transformers` and `optimum-intel` are each healthy, and the
        architecture is supported. The two versions simply do not agree on the
        Qwen3.5 modelling code, and the export needs the version the registry
        pins. Loading the config is not evidence that the export will work: a
        newer `transformers` still reads `Qwen3_5Config` and still reports
        `model_type: qwen3_5`, and only fails once the patcher runs.
      fallback_devices: []
      remediation:
        - >-
          Install the Transformers release this architecture requires, then
          re-run: pip install "transformers==5.2.*"
        - >-
          The requirement and the installed version are both printed by:
          yonga inspect MODEL
        - >-
          yonga will not install it for you: changing the Transformers version
          in your environment affects everything else that uses it, so that
          choice stays yours.
    sources:
      - kind: tested
        note: >-
          Reproduced on this reference host with optimum-intel 2.2.0 and
          transformers 5.5.4 while preparing a Qwen3.5-9B derivative for the GPU:
          optimum/exporters/openvino/model_patcher.py raised "ImportError: cannot
          import name 'Qwen3_5DynamicCache' from
          transformers.models.qwen3_5.modeling_qwen3_5". With transformers 5.2.0
          the symbol imports and the export proceeds.

  # The generic tier of the rule above, and the same two-tier shape the NPU
  # compiler rules use: the family-scoped rule wins where it applies, and this one
  # still recognises the failure for every other architecture, because the pin is
  # per-architecture (SPEC section 5.2) and every architecture can reach it.
  #
  # Each signature has to stand on its own, because `exception_contains` is a
  # disjunction — there is no way to require two strings at once — so each entry
  # below is chosen to be conclusive by itself rather than merely suggestive.
  - id: exporter-transformers-version-range
    schema_version: 1
    status: active
    priority: 60
    summary: optimum-intel refuses the installed Transformers for this architecture
    match:
      case_sensitive: true
      exception_contains:
        - "The current version of Transformers does not allow for the export of the model"
    classification:
      code: export.transformers.out_of_range
      category: package_abi_mismatch
      environment_broken: false
      retry_same_device: false
    recommendation:
      title: This architecture needs a different Transformers release
      message: >-
        optimum-intel's export configuration for this architecture declares the
        Transformers releases it supports, and the installed one is outside
        them. Nothing is broken; the two releases disagree about the modelling
        code. yonga reads that range before exporting and runs the export in a
        managed environment that satisfies it, so this appears only when that
        was turned off or the range could not be read.
      remediation:
        - "Let yonga build the environment: drop --no-managed-env (or set managed_export_envs = true)."
        - "Or install a release in the range the error names, e.g. pip install 'transformers<=5.0'"
    sources:
      - kind: tested
        note: >-
          optimum-intel 2.2.0 with Transformers 5.5.4 on the reference host:
          LiquidAI/LFM2-350M ("Maximum required is 5.4.0") and
          unsloth/gemma-3-1b-it ("Maximum required is 5.0").

  - id: optimum-normalized-config-allow-new
    schema_version: 4
    status: active
    priority: 60
    summary: optimum cannot build this architecture's export config on Python 3.14
    # The error only exists on Python 3.14, where functools.partial became a
    # method descriptor; on 3.11-3.13 the same optimum works.
    constraints:
      python: ">=3.14"
    # The failure is certain before anything runs, so prepare refuses these
    # model types before the download when the interpreter that will export
    # (a managed environment's, or yonga's own) is 3.14 and optimum is a release
    # without the fix. Measured on the reference host, 2026-10-11: building the
    # OpenVINO text-generation-with-past export config with optimum 2.3.0 on
    # Python 3.14.4 raises this error for exactly these decoder model types,
    # while it built for 65 others, llama, qwen2, qwen3, gemma, granite, olmo2,
    # lfm2, smollm3 and phi among them. The bound stays at 2.3.0 until a
    # release is shown to carry the fix; a later one still gets classified.
    blocks_export:
      model_types:
        - bloom
        - codegen
        - dbrx
        - gpt2
        - gpt_bigcode
        - gpt_neo
        - gptj
        - mistral
        - mixtral
        - mpt
        - phi3
        - phimoe
        - xglm
      constraints:
        optimum: "<=2.3.0"
      message: >-
        optimum 2.3.0 and earlier cannot build the export configuration of this
        architecture on Python 3.14: functools.partial became a method
        descriptor there, and optimum binds NormalizedConfig.with_args through
        one, so the export would stop with "NormalizedConfig.__init__() got
        multiple values for argument 'allow_new'" before any conversion. The
        defect is in optimum, not in yonga, the model or the device; optimum
        fixed it in pull request 2496, which no release carries yet.
    match:
      case_sensitive: true
      exception_contains:
        - "NormalizedConfig.__init__() got multiple values for argument 'allow_new'"
    classification:
      code: export.optimum.normalized_config
      category: package_abi_mismatch
      environment_broken: false
      retry_same_device: false
    recommendation:
      title: optimum cannot build this architecture's export config on Python 3.14
      message: >-
        optimum failed while constructing the export configuration, before any
        conversion started. On Python 3.14 functools.partial became a method
        descriptor, and optimum 2.3.0 and earlier bind NormalizedConfig.with_args
        through one, so every architecture whose export config uses it fails
        (among them mistral, mixtral, phi3, phimoe, gpt2 and bloom). The defect
        is in optimum, not in yonga, the model or the device; optimum fixed it
        in pull request 2496, which no release carries yet.
      remediation:
        - Run yonga from Python 3.11, 3.12 or 3.13, where the same optimum exports this architecture.
        - >-
          The AppImage cannot do that: it bundles Python 3.14 and builds its
          managed export environments on it. Install yonga with pip into a
          virtual environment on an older Python instead (docs/INSTALL.md
          section 2): python3.13 -m venv ~/.venvs/yonga, then
          ~/.venvs/yonga/bin/pip install "yonga[openvino,export]"
        - Or upgrade optimum once a release includes huggingface/optimum#2496 (optimum-intel must accept that release too).
        - Or pick a model of another architecture; 'yonga search QUERY' shows which ones the registry has verified.
    sources:
      - kind: tested
        note: >-
          microsoft/Phi-4-mini-instruct, optimum 2.3.0, optimum-intel 2.2.0,
          Transformers 5.5.4, Python 3.14.4, on the reference host. Building
          the export config for mistral and phi3 fails the same way there, and
          for llama it succeeds (2026-10-09).
      - kind: tested
        note: >-
          blocks_export: every model type optimum-intel 2.2.0 registers for
          OpenVINO text generation and Transformers 5.5.4 has a config for,
          export config built from that default config with optimum 2.3.0 on
          Python 3.14.4, reference host, 2026-10-11. The thirteen listed raised
          the allow_new TypeError; the encoder-decoder types that also raise it
          are left out, since yonga prepares decoder models.
      - kind: community
        url: https://github.com/huggingface/optimum/pull/2496

  - id: exporter-transformers-symbol-mismatch
    schema_version: 1
    status: active
    priority: 75
    summary: The exporter cannot patch the installed Transformers modelling code
    match:
      case_sensitive: true
      exception_contains:
        # The patcher's own file. It exists only to rewrite `transformers`
        # modelling internals for export, so a failure raised inside it is a
        # statement about which `transformers` is installed, whatever the
        # exception class.
        - "optimum/exporters/openvino/model_patcher.py"
        # "cannot import name 'X' from 'transformers.models.<a>.modeling_<a>'":
        # the quoted module path is contiguous with the word before it, so this
        # one substring pins the whole shape for any architecture.
        - "from 'transformers.models."
        # The attribute form of the same mismatch: "module
        # 'transformers.models.<a>.modeling_<a>' has no attribute 'X'".
        - "module 'transformers.models."
    classification:
      code: export.transformers.symbol_missing
      category: package_abi_mismatch
      environment_broken: false
      retry_same_device: false
    recommendation:
      title: The installed Transformers does not match what the exporter expects
      message: >-
        Converting a model runs that architecture's modelling code from
        `transformers`, and `optimum-intel` patches that code before tracing it.
        The patcher looked for something the installed release does not provide,
        so the two versions do not agree on this architecture. The installation
        is not broken and the device was never reached: this is a version
        pairing, and the registry records which Transformers release each
        architecture needs.
      fallback_devices: []
      remediation:
        - >-
          Install the Transformers release this architecture requires, then
          re-run. yonga will not change your environment for you.
        - >-
          The required version and the installed one are both printed by:
          yonga inspect MODEL
        - >-
          The failing import and the module it came from are in the job log:
          yonga logs JOB_ID --raw
    sources:
      - kind: tested
        note: >-
          Generic form of the Qwen3.5 symbol mismatch above, kept less specific
          so a family-scoped rule always wins where one exists. Verified on this
          reference host against the Qwen3.5 traceback; the same shape is what
          optimum-intel raises for any architecture whose patcher outruns the
          installed transformers.

  # Category choice, deliberately: `package_abi_mismatch` with
  # `environment_broken: true`. torch and torchvision are each installed, but
  # their native libraries come from two different builds (the CPU index and
  # PyPI's CUDA build, or two torch releases), so torchvision cannot register
  # its operators against this torch and anything that imports it dies. Every
  # export in this environment fails the same way, whatever the model, so this
  # environment *is* broken: exit 10, and no device is to blame or to fall back
  # to. Reached only when yonga exports in the environment it runs in; the
  # managed export environments install both from the same CPU index.
  - id: torchvision-torch-build-mismatch
    schema_version: 1
    status: active
    priority: 80
    summary: torchvision and torch come from incompatible builds
    match:
      case_sensitive: true
      exception_contains:
        - "operator torchvision::nms does not exist"
    classification:
      code: export.torchvision.build_mismatch
      category: package_abi_mismatch
      environment_broken: true
      retry_same_device: false
    recommendation:
      title: torchvision cannot load against the installed torch
      message: >-
        The exporter imports torchvision through Transformers, and torchvision
        could not register its native operators with the installed torch: the
        two were built for each other's different releases or indexes, most
        often a CPU build of torch from download.pytorch.org next to the
        default (CUDA) torchvision from PyPI. Every conversion in this Python
        environment fails at this import, before any model is read, so the
        model and the devices are not the problem. Transformers reports the
        same failure as "Could not import module 'PreTrainedModel'".
      fallback_devices: []
      remediation:
        - >-
          Replace torchvision with the build from torch's CPU index, in the
          environment yonga runs in: pip uninstall -y torchvision && pip install
          torchvision --index-url https://download.pytorch.org/whl/cpu
        - >-
          Then check that the exporter imports: yonga doctor --full (it imports
          the exporter again, with OpenVINO's usage reporting switched off)
        - yonga does not change your environment for you; that choice stays yours.
    sources:
      - kind: tested
        note: >-
          Reproduced on the reference host in a pip install of yonga 0.4.0 with
          torch 2.14.1+cpu from the CPU index and torchvision 0.29.1 from PyPI:
          `yonga prepare Qwen/Qwen3-0.6B --device cpu` exited 40 with the
          generic exporter message, and `python -c "import torchvision"` raised
          "RuntimeError: operator torchvision::nms does not exist". The same
          pair is what the managed export environment verification caught
          before it installed both from the CPU index (docs/TROUBLESHOOTING.md
          section 5.7).
      - kind: tested
        note: >-
          The repair, in a scratch venv on the reference host (2026-10-11):
          torch 2.14.1+cpu, numpy 2.4.6 and PyPI's torchvision 0.29.1. Uninstalling
          torchvision and installing it from the CPU index replaced only
          torchvision (0.29.1+cpu), the import worked and pip check was clean.
          The earlier advice, pip install --force-reinstall torch torchvision
          from the CPU index, reinstalled every dependency from that index too
          and upgraded numpy to 2.5.2, past nncf 3.4.0's numpy<2.5.0.
