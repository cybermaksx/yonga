  - id: arch-phi3
    schema_version: 1
    status: active
    priority: 100
    summary: Phi-3 / Phi-4-mini decoder-only family
    match:
      model_types:
        - phi3
      architectures:
        - Phi3ForCausalLM
    export:
      pipeline: llm
      task: text-generation-with-past
      trust_remote_code: false
      # Phi-4-mini's repository ships modeling_phi3.py and an auto_map, but
      # Transformers has implemented phi3 natively since 4.40: with remote code
      # off that file is ignored and never run.
      native_implementation: true
    devices:
      cpu:
        status: supported
        evidence: tested
        notes:
          - >-
            Phi-4-mini prepared and evaluated on the CPU (2026-10-09), exported
            with the patched optimum described under the NPU entry.
      gpu:
        status: unknown
        evidence: unknown
      npu:
        status: supported
        evidence: tested
        notes:
          - >-
            Phi-4-mini compiled and generated on the NPU with npu-int4-sym-cw and
            npu-int4-sym-g128 (2026-10-09). It was exported on Python 3.14 with
            optimum 2.3.0 plus the one-line fix of optimum pull request 2496, which
            changes descriptor binding only, not the exported graph; released
            optimum cannot export phi3 on Python 3.14 (known_limitations).
    recommended_device: gpu
    # No NPU pin: below 5B the NPU gets npu-int4-sym-g128 as every measured
    # family does (docs/PROFILE_COMPARISON.md section 10.3).
    known_limitations:
      - >-
        On Python 3.14, optimum 2.3.0 (the release optimum-intel 2.2.0
        requires) cannot build the phi3 export config ("NormalizedConfig.__init__()
        got multiple values for argument 'allow_new'"); optimum fixed it in pull
        request 2496, which no release carries yet. Python 3.11-3.13 are not
        affected. The failure is in the exporter, not in yonga or the model.
    sources:
      - kind: official_docs
        url: https://huggingface.co/docs/transformers/model_doc/phi3
      - kind: tested
        note: >-
          microsoft/Phi-4-mini-instruct on the Lunar Lake reference host: remote
          code correctly not required; the optimum-intel 2.2.0 export then failed
          with the NormalizedConfig 'allow_new' TypeError.
      - kind: tested
        note: >-
          microsoft/Phi-4-mini-instruct (Hub 3.84B) on the Lunar Lake reference
          host, 2026-10-09, OpenVINO 2026.4, optimum-intel 2.2.0, NNCF 3.4.0,
          evaluated on the CPU against cpu-int8-asym-ref. On the NPU,
          npu-int4-sym-g128 against npu-int4-sym-cw: KL 0.240 against 0.427,
          perplexity +20.3 % against +44.9 %, 21.9 against 25.1 tok/s (time to
          first token 866 against 715 ms). On the CPU, ratio 0.8 against 1.0: KL
          0.212 against 0.231. Exported on Python 3.14 in a scratch environment
          with optimum 2.3.0 plus the one-line fix of optimum pull request 2496
          (a staticmethod around the functools.partial in
          NormalizedConfig.with_args), which released optimum lacks; the fix
          changes descriptor binding only, not the exported graph.
