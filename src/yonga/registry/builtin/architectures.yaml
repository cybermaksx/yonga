# Architecture rules: device support, exporter requirements and family defaults.
#
# Every claim here should carry provenance. When evidence is missing, say
# "unknown" instead of guessing; runtime probing settles the rest.
schema_version: 1

architectures:
  - id: arch-qwen3_5
    schema_version: 1
    status: active
    priority: 100
    summary: Qwen3.5 hybrid vision-language architecture
    match:
      model_types:
        - qwen3_5
      architectures:
        - Qwen3_5ForConditionalGeneration
        - Qwen3_5ForCausalLM
      # Spellings this architecture is known by outside config.json. `qwen35` is
      # the identifier GGUF files carry in their own header, so a GGUF-only
      # repository that publishes no config.json is still identified here
      # instead of falling through to "unknown". Aliases are compared only
      # against identifiers read out of a weight file, never against repository
      # tags, so listing one stays a deliberate registry decision.
      aliases:
        - qwen35
        - qwen3_5
    export:
      transformers: "==5.2.*"
      pipeline: vlm
      trust_remote_code: false
    devices:
      cpu:
        status: supported
        evidence: official
      gpu:
        status: supported
        evidence: official
      npu:
        status: unsupported
        evidence: tested
        constraints:
          openvino: ">=2026.2,<2027"
        reason: current_npu_compiler_graph_limitation
        notes:
          - >-
            The NPU plugin compiles the graph and then rejects it. The driver and
            the compiler are healthy; the graph is what is unsupported.
    recommended_device: gpu
    # No profile pin: the size bands decide, as for the text families. Below 5B
    # ratio 1.0 does not even prepare (known_limitations), and ratio 0.8 does.
    # The Hub count includes the vision tower, which can only move a model
    # toward the 5B-and-above profiles. docs/PROFILE_COMPARISON.md section 10.6.
    chat_profile: chat-qwen3_5
    known_limitations:
      - >-
        Export needs Transformers 5.2; newer Transformers releases change the
        modelling code this architecture was exported with.
      - NPU is not a target for this architecture on OpenVINO 2026.x.
      - >-
        Ratio-1.0 group-wise INT4 (cpu-int4-asym-g128, gpu-int4-asym-g128) fails
        on Qwen3.5 0.8B, 2B and 4B with export.quantization.group_size_mismatch:
        NNCF cannot split the one-channel weight of
        `__module.rotary_emb/aten::matmul/MatMul` into groups of 128. Ratio 0.8,
        the default below 5B, prepares all three, because NNCF's mixed-precision
        step kept that weight in its INT8 backup precision; that was observed
        with NNCF 3.4.0, not guaranteed. The 9B prepares at ratio 1.0.
    sources:
      - kind: official_docs
        url: https://github.com/openvinotoolkit/openvino.genai/blob/master/site/docs/supported-models/index.mdx
      - kind: tested
        note: >-
          A Qwen3.5-9B derivative failed NPU compilation on a Lunar Lake host with
          OpenVINO 2026.4 and compiler-in-plugin, while GPU compilation succeeded.
      - kind: tested
        url: https://huggingface.co/HauhauCS/Qwen3.5-9B-Uncensored-HauhauCS-Aggressive
        note: >-
          GGUF files for this architecture carry `qwen35` in their header, which is
          the provenance for the `match.aliases` entry. Verified against
          HauhauCS/Qwen3.5-9B-Uncensored-HauhauCS-Aggressive, a GGUF-only repository
          with no config.json, whose Hub `gguf_metadata` reports
          `{"architecture": "qwen35"}`.
      - kind: tested
        note: >-
          Direct evidence for the `export.transformers` pin, from this reference
          host (2026-09-22). With optimum-intel 2.2.0 and transformers 5.5.4 the
          export fails in optimum/exporters/openvino/model_patcher.py with
          "ImportError: cannot import name 'Qwen3_5DynamicCache' from
          transformers.models.qwen3_5.modeling_qwen3_5"; with transformers 5.2.0
          the same symbol imports and the export proceeds. The trap: 5.5.4 still
          loads `Qwen3_5Config` and still reports `model_type: qwen3_5`, so the
          architecture looks supported. Config loading is therefore not evidence
          that the export will work, and this requirement must not be relaxed on
          the strength of it.
      - kind: tested
        note: >-
          Qwen/Qwen3.5-0.8B, -2B and -4B (Hub 0.87B, 2.27B, 4.66B, vision tower
          included) on the Lunar Lake reference host, 2026-10-09, OpenVINO 2026.4,
          optimum-intel 2.2.0, NNCF 3.4.0. cpu-int4-asym-g128 failed on all three
          (and gpu-int4-asym-g128 on the 0.8B, the one tried) with NNCF's
          InvalidGroupSizeError on `__module.rotary_emb/aten::matmul/MatMul`
          (channel size 1). cpu-int4-asym-g128-r08 and gpu-int4-asym-g128-r08
          prepared all three; against cpu-int8-asym-ref, text only, on the CPU
          the r08 artifacts measured KL 0.152 / 0.098 / 0.064 and perplexity
          +19.9 / +12.2 / +8.0 %. nDimensional/Qwen3.5-9B-Uncensored-Safetensors
          (Hub 9.65B) still prepared with cpu-int4-asym-g128 the same day.

  - id: arch-generic-text-generation
    schema_version: 1
    status: active
    priority: 10
    summary: Fallback rule for common decoder-only text-generation families
    match:
      model_types:
        - llama
        - qwen2
        - qwen3
        - mistral
      architectures:
        - LlamaForCausalLM
        - Qwen2ForCausalLM
        - Qwen3ForCausalLM
        - MistralForCausalLM
      # The same families as GGUF headers name them (`general.architecture`),
      # so a GGUF-only repository with no config.json is identified too.
      aliases:
        - llama
        - qwen2
        - qwen3
    export:
      pipeline: llm
      task: text-generation-with-past
      trust_remote_code: false
    devices:
      cpu:
        status: supported
        evidence: inferred
        notes:
          - CPU is the reference target for every OpenVINO text-generation export.
      gpu:
        status: supported
        evidence: inferred
      npu:
        status: unknown
        evidence: unknown
        reason: not_verified_for_this_family
        notes:
          - >-
            NPU support depends on the exact graph. Probe the compiled artifact
            before claiming support.
          - >-
            One mistral model, h2oai/h2o-danube2-1.8b-chat, compiled and generated
            on the NPU in both INT4 formats (2026-10-09). Nothing else this rule
            catches was tried on the NPU.
    recommended_device: gpu
    # No NPU pin: below 5B the NPU gets npu-int4-sym-g128 as every measured
    # family does. Measured through this rule for one mistral model only.
    chat_profile: chat-default
    known_limitations:
      - >-
        On Python 3.14, optimum 2.3.0 cannot build the mistral export config
        ("NormalizedConfig.__init__() got multiple values for argument
        'allow_new'"); optimum fixed it in pull request 2496, which no release
        carries yet. Python 3.11-3.13 are not affected.
    sources:
      - kind: official_docs
        url: https://docs.openvino.ai/2026/openvino-workflow-generative/inference-with-genai.html
      - kind: community
        note: >-
          Family-level fallback so unknown members of well-known decoder-only
          families still get a usable CPU/GPU plan.
      - kind: tested
        note: >-
          h2oai/h2o-danube2-1.8b-chat (MistralForCausalLM, Hub 1.83B) on the Lunar
          Lake reference host, 2026-10-09, OpenVINO 2026.4, optimum-intel 2.2.0,
          NNCF 3.4.0, evaluated on the CPU against cpu-int8-asym-ref. On the NPU,
          npu-int4-sym-g128 against npu-int4-sym-cw: KL 0.208 against 0.367,
          perplexity +15.5 % against +30.0 %, 41.8 against 56.4 tok/s (time to
          first token 397 against 313 ms). On the CPU, ratio 0.8 against 1.0: KL
          0.166 against 0.192. Exported on Python 3.14 in a scratch environment
          with optimum 2.3.0 plus the one-line fix of optimum pull request 2496
          (a staticmethod around the functools.partial in
          NormalizedConfig.with_args), which released optimum lacks; the fix
          changes descriptor binding only, not the exported graph. This is the
          only model measured through this rule.

