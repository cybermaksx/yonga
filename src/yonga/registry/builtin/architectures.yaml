  - id: arch-phi3
    schema_version: 1
    status: active
    priority: 100
    summary: Phi-3 / Phi-4-mini decoder-only family
    match:
      model_types:
        - phi3
      architectures:
        - Phi3ForCausalLM
    export:
      pipeline: llm
      task: text-generation-with-past
      trust_remote_code: false
      # Phi-4-mini's repository ships modeling_phi3.py and an auto_map, but
      # Transformers has implemented phi3 natively since 4.40: with remote code
      # off that file is ignored and never run.
      native_implementation: true
    devices:
      cpu:
        status: unknown
        evidence: unknown
      gpu:
        status: unknown
        evidence: unknown
      npu:
        status: unknown
        evidence: unknown
    recommended_device: gpu
    profiles:
      gpu: gpu-int4-asym-g128
      cpu: cpu-int4-asym-g128
    known_limitations:
      - >-
        With optimum 2.3.0 and optimum-intel 2.2.0 (the pair optimum-intel
        requires) the export of microsoft/Phi-4-mini-instruct fails inside
        optimum ("NormalizedConfig.__init__() got multiple values for argument
        'allow_new'"). The failure is in the exporter, not in yonga or the model;
        device support stays unknown until an exporter release converts it.
    sources:
      - kind: official_docs
        url: https://huggingface.co/docs/transformers/model_doc/phi3
      - kind: tested
        note: >-
          microsoft/Phi-4-mini-instruct on the Lunar Lake reference host: remote
          code correctly not required; the optimum-intel 2.2.0 export then failed
          with the NormalizedConfig 'allow_new' TypeError.
