# Architecture rules: device support, exporter requirements and family defaults.
#
# Every claim here should carry provenance. When evidence is missing, say
# "unknown" instead of guessing; runtime probing settles the rest.
schema_version: 1

architectures:
  - id: arch-qwen3_5
    schema_version: 1
    status: active
    priority: 100
    summary: Qwen3.5 hybrid vision-language architecture
    match:
      model_types:
        - qwen3_5
      architectures:
        - Qwen3_5ForConditionalGeneration
        - Qwen3_5ForCausalLM
      # Spellings this architecture is known by outside config.json. `qwen35` is
      # the identifier GGUF files carry in their own header, so a GGUF-only
      # repository that publishes no config.json is still identified here
      # instead of falling through to "unknown". Aliases are compared only
      # against identifiers read out of a weight file, never against repository
      # tags, so listing one stays a deliberate registry decision.
      aliases:
        - qwen35
        - qwen3_5
    export:
      transformers: "==5.2.*"
      pipeline: vlm
      trust_remote_code: false
    devices:
      cpu:
        status: supported
        evidence: official
      gpu:
        status: supported
        evidence: official
      npu:
        status: unsupported
        evidence: tested
        constraints:
          openvino: ">=2026.2,<2027"
        reason: current_npu_compiler_graph_limitation
        notes:
          - >-
            The NPU plugin compiles the graph and then rejects it. The driver and
            the compiler are healthy; the graph is what is unsupported.
    recommended_device: gpu
    profiles:
      gpu: gpu-int4-asym-g128
      cpu: cpu-int4-asym-g128
    chat_profile: chat-qwen3_5
    known_limitations:
      - >-
        Export needs Transformers 5.2; newer Transformers releases change the
        modelling code this architecture was exported with.
      - NPU is not a target for this architecture on OpenVINO 2026.x.
    sources:
      - kind: official_docs
        url: https://github.com/openvinotoolkit/openvino.genai/blob/master/site/docs/supported-models/index.mdx
      - kind: tested
        note: >-
          A Qwen3.5-9B derivative failed NPU compilation on a Lunar Lake host with
          OpenVINO 2026.4 and compiler-in-plugin, while GPU compilation succeeded.
      - kind: tested
        url: https://huggingface.co/HauhauCS/Qwen3.5-9B-Uncensored-HauhauCS-Aggressive
        note: >-
          GGUF files for this architecture carry `qwen35` in their header, which is
          the provenance for the `match.aliases` entry. Verified against
          HauhauCS/Qwen3.5-9B-Uncensored-HauhauCS-Aggressive, a GGUF-only repository
          with no config.json, whose Hub `gguf_metadata` reports
          `{"architecture": "qwen35"}`.
      - kind: tested
        note: >-
          Direct evidence for the `export.transformers` pin, from this reference
          host (2026-09-22). With optimum-intel 2.2.0 and transformers 5.5.4 the
          export fails in optimum/exporters/openvino/model_patcher.py with
          "ImportError: cannot import name 'Qwen3_5DynamicCache' from
          transformers.models.qwen3_5.modeling_qwen3_5"; with transformers 5.2.0
          the same symbol imports and the export proceeds. The trap: 5.5.4 still
          loads `Qwen3_5Config` and still reports `model_type: qwen3_5`, so the
          architecture looks supported. Config loading is therefore not evidence
          that the export will work, and this requirement must not be relaxed on
          the strength of it.

  - id: arch-generic-text-generation
    schema_version: 1
    status: active
    priority: 10
    summary: Fallback rule for common decoder-only text-generation families
    match:
      model_types:
        - llama
        - qwen2
        - qwen3
        - mistral
      architectures:
        - LlamaForCausalLM
        - Qwen2ForCausalLM
        - Qwen3ForCausalLM
        - MistralForCausalLM
      # The same families as GGUF headers name them (`general.architecture`),
      # so a GGUF-only repository with no config.json is identified too.
      aliases:
        - llama
        - qwen2
        - qwen3
    export:
      pipeline: llm
      task: text-generation-with-past
      trust_remote_code: false
    devices:
      cpu:
        status: supported
        evidence: inferred
        notes:
          - CPU is the reference target for every OpenVINO text-generation export.
      gpu:
        status: supported
        evidence: inferred
      npu:
        status: unknown
        evidence: unknown
        reason: not_verified_for_this_family
        notes:
          - >-
            NPU support depends on the exact graph. Probe the compiled artifact
            before claiming support.
    recommended_device: gpu
    profiles:
      gpu: gpu-int4-asym-g128
      cpu: cpu-int4-asym-g128
      npu: npu-int4-sym-cw
    chat_profile: chat-default
    sources:
      - kind: official_docs
        url: https://docs.openvino.ai/2026/openvino-workflow-generative/inference-with-genai.html
      - kind: community
        note: >-
          Family-level fallback so unknown members of well-known decoder-only
          families still get a usable CPU/GPU plan.

