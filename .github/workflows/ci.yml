# Continuous integration for yonga (docs/TESTING.md section 11).
#
# The runners have no Intel hardware and the tests must not reach the network.
# Both are already handled by the default `addopts` in pyproject.toml, which
# deselects `network`, `intel_gpu`, `intel_npu`, `large_model` and `slow`. No job
# here passes `-m`: overriding that expression is how a CI run would start
# depending on a device it does not have. Verified locally with every outbound
# connection refused, as the steps below invoke it.
name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  PIP_DISABLE_PIP_VERSION_CHECK: "1"

jobs:
  lint:
    name: lint (ruff)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml

      # Ruff reads the source; it needs neither the OpenVINO runtime nor the
      # conversion toolchain, and its result does not depend on the interpreter
      # (pyproject pins `target-version = "py311"`), so this job runs once.
      - name: Install lint tooling
        run: python -m pip install -e ".[dev]"

      # The whole tree, not just src and tests: `tools/` holds runnable Python
      # too, and a lint gate that skips it is not the gate we run locally.
      - name: ruff check
        run: ruff check .

      - name: ruff format --check
        run: ruff format --check .

  typing:
    name: typing (mypy, py${{ matrix.python-version }})
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13", "3.14"]
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: pyproject.toml

      # `[serve]` because src/yonga/api imports FastAPI, which mypy checks for
      # real. No openvino/export extras on purpose. pyproject declares
      # `ignore_missing_imports` for openvino, openvino_genai, optimum, nncf,
      # transformers and torch, so mypy type-checks the whole tree without the
      # heavy wheels. Verified in a clean venv holding only the base package and
      # `[dev]` — which resolves typer 0.27.2 and click 8.5.0, not the typer
      # 0.25.1 this repository's own .venv pins: clean, 110 source files.
      # numpy for the eval code's types; it arrives with OpenVINO otherwise.
      # Below 2.5: numpy 2.5's stubs use the 3.12 `type` statement, which mypy
      # rejects while checking against python_version = 3.11.
      - name: Install package and typing tooling
        run: python -m pip install -e ".[dev,serve]" "numpy<2.5"

      - name: mypy
        run: mypy src tests

  tests:
    name: tests (py${{ matrix.python-version }})
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13", "3.14"]
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: pyproject.toml

      # The openvino and export extras ARE required here, unlike in the two jobs
      # above. Parts of the suite assert against the real installed stack rather
      # than a fake: the exporter reports the versions of openvino/transformers it
      # would run with, `doctor` enumerates OpenVINO devices, and the `openvino`
      # marker is not in the deselected set. Verified: in an environment with only
      # the base package and `[dev]`, five tests fail — two in
      # tests/unit/test_exporter_optimum.py, one in
      # tests/integration/test_exporter_fake.py and two in
      # tests/integration/test_cli_commands.py.
      #
      # None of this needs Intel hardware: the OpenVINO CPU plugin runs anywhere,
      # and the tests that need a real GPU or NPU carry the `intel_gpu`/`intel_npu`
      # markers and stay deselected.
      - name: Install package with the full toolchain
        run: python -m pip install -e ".[openvino,export,serve,dev]"

      - name: Report the installed stack
        run: python -m pip list

      - name: Unit tests
        run: pytest tests/unit

      - name: Integration tests
        run: pytest tests/integration

  base-install:
    name: tests without extras (py${{ matrix.python-version }})
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.14"]
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: pyproject.toml

      # `pip install yonga` with no extras is where most users start, and every
      # command must import and explain itself without OpenVINO. A module-level
      # import of an optional dependency broke exactly that once (numpy, pulled
      # in by eval); this job is the guard. Tests that need numpy or the export
      # toolchain skip themselves here.
      - name: Install package without the OpenVINO or export extras
        run: python -m pip install -e ".[dev,serve]"

      - name: Unit and integration tests
        run: pytest tests/unit tests/integration

  package:
    name: package (build, twine, clean install)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v6
        with:
          python-version: "3.14"

      - name: Build the sdist and wheel
        run: |
          python -m pip install build twine
          python -m build
          twine check --strict dist/*

      # The wheel alone, no extras, exactly as `pip install yonga` will be.
      - name: Smoke-test a clean install
        run: |
          python -m venv /tmp/clean
          /tmp/clean/bin/pip install dist/*.whl
          /tmp/clean/bin/yonga --version
          /tmp/clean/bin/yonga --help > /dev/null
          /tmp/clean/bin/yonga registry validate
          # No OpenVINO installed: doctor must say so and exit 10, not crash.
          set +e; /tmp/clean/bin/yonga doctor > /dev/null; code=$?; set -e
          test "$code" -eq 10

      - uses: actions/upload-artifact@v7
        with:
          name: dist
          path: dist/

  appimage:
    name: AppImage (build from the wheel, smoke test)
    needs: package
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7

      - uses: actions/download-artifact@v8
        with:
          name: dist
          path: dist/

      # The same script the release runs, from the wheel `package` just built.
      # It pins and checksums the interpreter and the AppImage tools, records
      # the Python packages pip resolved in the image and beside it (they are
      # not pinned), and fails if a bundled library needs a newer glibc than the
      # image supports.
      - name: Build the AppImage
        run: tools/build_appimage.sh --wheel dist/yonga-*.whl

      # Outside the checkout, so nothing can resolve against the source tree,
      # and beside a decoy `typer.py`: the image must import its own modules,
      # never one from the directory it is run in. Runners have no FUSE;
      # extract-and-run is how the image starts there. doctor exits 2 on a host
      # without a GPU or NPU; what must hold is that the bundled OpenVINO runtime
      # is usable.
      - name: Smoke-test the image
        working-directory: /tmp
        env:
          APPIMAGE_EXTRACT_AND_RUN: "1"
        run: |
          app="$(ls "$GITHUB_WORKSPACE"/dist/yonga-*-x86_64.AppImage)"
          mkdir decoy && cd decoy
          echo 'raise SystemExit("imported typer.py from the current directory")' > typer.py
          "$app" --version
          "$app" registry validate
          "$app" doctor --json > doctor.json || true
          python3 -c "import json; d = json.load(open('doctor.json')); assert d['runtime_usable'], d"

      - uses: actions/upload-artifact@v7
        with:
          name: appimage
          path: |
            dist/*.AppImage
            dist/*.AppImage.sha256
            dist/*.AppImage.packages.txt
          retention-days: 14
