name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

# Hosted runners have no Intel GPU or NPU. The intel_gpu / intel_npu suites are
# run on real hardware before a release (docs/USAGE.md, "Testing"), never here.
env:
  UNIT: "not network and not openvino and not intel_gpu and not intel_npu and not slow and not large_model"

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
      - run: pip install -e ".[dev,serve]"
      - run: ruff check src tests tools
      - run: ruff format --check src tests tools
      - run: mypy src tests

  unit:
    name: unit (Python ${{ matrix.python }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ["3.11", "3.12", "3.13", "3.14"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      # No OpenVINO: this is the install most users start from, and every
      # command must still import and explain itself without it.
      - run: pip install -e ".[dev,serve]"
      - run: pytest -m "$UNIT"

  openvino-cpu:
    name: OpenVINO on CPU
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -e ".[dev,serve,openvino,export]"
      # A real optimum-intel export of a tiny random Llama (about 7 MB).
      - run: python tools/make_test_artifact.py
      - run: pytest -m "openvino and not intel_gpu and not intel_npu and not slow and not large_model"

  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
      - run: pip install build twine
      - run: python -m build
      - run: twine check --strict dist/*
      # Install the wheel alone, with no extras, the way `pip install yonga` will.
      - name: Smoke-test a clean install
        run: |
          python -m venv /tmp/clean
          /tmp/clean/bin/pip install dist/*.whl
          /tmp/clean/bin/yonga --version
          /tmp/clean/bin/yonga --help > /dev/null
          /tmp/clean/bin/yonga registry validate
          # No OpenVINO installed: doctor must say so and exit 10, not crash.
          set +e; /tmp/clean/bin/yonga doctor > /dev/null; code=$?; set -e
          test "$code" -eq 10
      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/
