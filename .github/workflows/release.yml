name: Release

# A release is a version tag, e.g. `git tag v0.2.0 && git push origin v0.2.0`.
# The tag builds the sdist, the wheel and the AppImage and attaches them to a
# GitHub release whose notes are that version's CHANGELOG section.
#
# PyPI publishing uses trusted publishing, so no token is stored anywhere. The
# PyPI project must list this repository, `release.yml` and the `pypi`
# environment as a trusted publisher first (docs/RELEASING.md). It runs only
# while the repository is public: an sdist is the source code, and publishing
# one from a private repository would publish what the repository keeps
# private. A tag pushed while private is published later, once the repository
# is public, by running this workflow by hand with that tag.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing version tag to publish to PyPI, e.g. v0.2.0"
        required: true

permissions:
  contents: read

env:
  TAG: ${{ inputs.tag || github.ref_name }}

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.TAG }}
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
      - run: pip install build twine
      - name: The tag must match the package version
        run: |
          version=$(python -c "import tomllib;print(tomllib.load(open('pyproject.toml','rb'))['project']['version'])")
          test "v$version" = "$TAG" || { echo "tag $TAG != v$version"; exit 1; }
      - run: python -m build
      - run: twine check --strict dist/*
      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/

  appimage:
    needs: build
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.TAG }}
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/
      - name: Build the AppImage from the released wheel
        run: |
          tools/build_appimage.sh --wheel dist/yonga-*.whl
          mkdir appimage && mv dist/*.AppImage dist/*.AppImage.sha256 appimage/
      - name: Smoke-test it
        working-directory: /tmp
        env:
          APPIMAGE_EXTRACT_AND_RUN: "1"
        run: |
          app="$(ls "$GITHUB_WORKSPACE"/appimage/*.AppImage)"
          test "$("$app" --version)" = "yonga ${TAG#v}"
          "$app" registry validate
      - uses: actions/upload-artifact@v4
        with:
          name: appimage
          path: appimage/

  publish-pypi:
    needs: build
    if: github.event.repository.visibility == 'public'
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/p/yonga
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@release/v1

  github-release:
    needs: [build, appimage]
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.TAG }}
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/
      - uses: actions/download-artifact@v4
        with:
          name: appimage
          path: dist/
      - name: Create the GitHub release with the built files
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 tools/release_notes.py "${TAG#v}" > notes.md
          gh release create "$TAG" dist/* --title "$TAG" --notes-file notes.md
